# Base Streamlit chrome. CLI/app/theme.py layers the custom look on top.
# Committed on purpose: this file is what makes the HOSTED deployment look
# identical to a local run. Keep the palette in sync with theme.py.

[theme]
primaryColor = "#4f46e5"
font = "sans serif"
baseRadius = "0.6rem"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[browser]
gatherUsageStats = false

# Hardening for the public deployment (harmless locally).
[server]
# Bank statements and backups are kilobytes; the 200 MB default only invites
# memory-exhaustion uploads on a shared host.
maxUploadSize = 10
enableXsrfProtection = true
enableCORS = true
