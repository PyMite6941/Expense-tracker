name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Only what CLI/core needs; the full requirements.txt pulls in the UI and AI stacks.
      - run: pip install pytest pandas matplotlib reportlab requests cryptography
      - run: pytest -q
