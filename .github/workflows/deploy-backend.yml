name: Deploy Backend to Cloud Run

# MANUAL ONLY since 2026-11-03. Production moved to Vercel (deploy-vercel.yml)
# because GCP billing is off; every push here was failing and opening an issue.
# Kept so Cloud Run can be revived: re-enable billing, then run it by hand.
on:
  workflow_dispatch:

# Required for keyless auth: the job mints a GitHub OIDC token that
# Workload Identity Federation exchanges for short-lived GCP credentials.
permissions:
  contents: read
  id-token: write
  issues: write   # to report a failed deploy (they failed silently Jul-Nov 2026)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Fails fast with a clear message if a secret is missing rather than
      # surfacing the confusing "specify exactly one of..." auth error.
      # Auth is keyless (WIF) — there is no GCP_SA_KEY; org policy blocks JSON keys.
      - name: Verify secrets are set
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=()
          [ -z "$GCP_PROJECT_ID" ]      && missing+=("GCP_PROJECT_ID")
          [ -z "$GCP_WIF_PROVIDER" ]    && missing+=("GCP_WIF_PROVIDER")
          [ -z "$GCP_SERVICE_ACCOUNT" ] && missing+=("GCP_SERVICE_ACCOUNT")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secret(s): ${missing[*]}"
            echo "Go to Settings → Secrets and variables → Actions and add them."
            exit 1
          fi

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        run: |
          cd backend
          gcloud run deploy expense-backend \
            --source . \
            --region us-central1 \
            --allow-unauthenticated \
            --project ${{ secrets.GCP_PROJECT_ID }}

      # A failed deploy means production silently keeps running old code.
      # Open an issue so GitHub emails the owner.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create deploy-failed --color D93F0B 2>/dev/null || true
          gh issue create --label deploy-failed             --title "Backend deploy failed: ${GITHUB_SHA::7}"             --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Production is still on the previous revision."
